name: Release

# Publishing a release on GitHub with a tag like v1.2.0 (or pushing such a tag) builds everything for it: a signed
# APK attached to the release and the server image ghcr.io/<owner>/drinkwater:1.2.0, also tagged latest, which the
# Docker host installs (setup.sh, update.sh). See "Releases" in README.md, also for the secrets this needs.
on:
  push:
    tags: ['v*']

# One release at a time, and never cancelled halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # To create the release and attach the APK.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Release tags look like v1.2.3, with minor and patch below 100 (got $tag)."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check the release settings
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVER_URL: ${{ vars.RELEASE_SERVER_URL }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "$SERVER_URL" ] || missing="$missing RELEASE_SERVER_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets or variables:$missing. See \"Releases\" in README.md."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests
        run: ./gradlew :server:test :composeApp:testDebugUnitTest

      - name: Build signed APK, server and web app
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVER_URL: ${{ vars.RELEASE_SERVER_URL }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Outside the checkout, so nothing can pick the key up by accident.
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ./gradlew :composeApp:assembleRelease :server:installDist :composeApp:wasmJsBrowserDistribution \
            -Pdrinkwater.version="$VERSION" \
            -Pdrinkwater.releaseServerUrl="$SERVER_URL" \
            -Pdrinkwater.signing.storeFile="$RUNNER_TEMP/release.jks" \
            -Pdrinkwater.signing.storePassword="$STORE_PASSWORD" \
            -Pdrinkwater.signing.keyAlias="$KEY_ALIAS" \
            -Pdrinkwater.signing.keyPassword="$KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.jks"
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "$RUNNER_TEMP/drinkwater-$VERSION.apk"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/drinkwater
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DRINKWATER_VERSION=${{ steps.version.outputs.version }}

      # A release published on GitHub already exists and gets the APK; a tag pushed with git gets a new release.
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="$RUNNER_TEMP/drinkwater-$VERSION.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" --title "$VERSION" --generate-notes
          fi
