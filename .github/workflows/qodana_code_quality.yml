name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          # The cache restored a project model whose Kotlin/Native SDK was gone, so every run on main failed with
          # "Please, specify sdk 'Kotlin SDK' for module ...iosArm64Main", and runs that got through analysed a half
          # loaded project ("Kotlin sanity" problems). A cold start takes a few minutes longer but loads it properly.
          use-caches: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_250719456 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'