name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To publish the server image to GitHub Container Registry.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Server tests
        run: ./gradlew :server:test

      - name: App tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Build Android app (debug and release)
        # Release builds need a server address; any https:// one does for checking that it builds.
        run: ./gradlew :composeApp:assembleDebug :composeApp:assembleRelease -Pdrinkwater.releaseServerUrl=https://drinkwater.example.com

      - name: Build web app
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      # The server image: built on every run so a broken Dockerfile shows up in pull requests, and published from
      # main as ghcr.io/<owner>/drinkwater:main and :sha-<commit>, to try out what is on main. Releases publish
      # :latest, which the Docker host follows (release.yml, README "Releases").
      - name: Build server for the image
        run: ./gradlew :server:installDist

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the image reports at /version and the apps show, like the :sha-<commit> tag.
      - name: Name the build
        id: version
        run: |
          short="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then name=main; else name=dev; fi
          echo "version=$name ($short)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/drinkwater
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile only copies files onto a Java image, so both need no emulation: a Raspberry Pi works too.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DRINKWATER_VERSION=${{ steps.version.outputs.version }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-reports
          path: server/build/reports/tests/

      - name: Upload web app
        uses: actions/upload-artifact@v7
        with:
          name: drinkwater-web
          path: composeApp/build/dist/wasmJs/productionExecutable/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: drinkwater-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
