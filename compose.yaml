# The server behind a Cloudflare Tunnel, see "Hosting the server" in README.md. setup.sh puts this file on the
# Docker host next to a .env with JWT_SECRET, TUNNEL_TOKEN and the rest, and update.sh pulls the newest image.
# Local additions, like the FCM key, go in compose.override.yaml next to it: setup.sh replaces this file.
# Docker keeps container logs forever by default; this caps them at 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  server:
    # Built and published by GitHub Actions from main (.github/workflows/build.yml). To go back to an earlier
    # version, set DRINKWATER_IMAGE=ghcr.io/zingo21/drinkwater:sha-<commit> in .env and run update.sh.
    image: ${DRINKWATER_IMAGE:-ghcr.io/zingo21/drinkwater:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Cloudflare sets this to the caller's address. No port is published, so the tunnel is the only way in
      # and nobody can send the header past it.
      TRUSTED_CLIENT_IP_HEADER: CF-Connecting-IP
      # The admin panel, see "Admin panel" in README.md. It only runs when .env names who may use it.
      ADMIN_TAILSCALE_USERS: ${ADMIN_TAILSCALE_USERS:-}
      ADMIN_HOST: 0.0.0.0
      # Push to the web app, see "Push notifications" in README.md. Off unless .env sets it.
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
    ports:
      # Published on the VM's own 127.0.0.1 only, for `tailscale serve`. Never route the tunnel here.
      - "127.0.0.1:8090:8090"
    volumes:
      - data:/data

  tunnel:
    # Cloudflare only supports cloudflared releases from the last year, so this follows the newest one.
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    logging: *logging
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - server

volumes:
  data:
