# Fly.io deployment, see "Hosting the server" in README.md. The app name must be unique on Fly.
app = "drinkwater"
primary_region = "arn"

[env]
  # Fly's proxy puts the caller's address here and overwrites whatever the client sent.
  TRUSTED_CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine that keeps running: the database is a SQLite file on its volume, and open
  # notification connections live in its memory, so it can't be split across machines.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "drinkwater_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
