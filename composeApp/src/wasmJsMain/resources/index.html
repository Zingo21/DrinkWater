<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DrinkWater</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-title" content="DrinkWater">
    <!-- The app's top bar: purple in the light theme, Material's dark surface in the dark one. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#6200EE">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
    <meta name="color-scheme" content="light dark">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #000; }
        /* So a dark device doesn't flash white while the app loads; the app then draws its own background. */
        @media (prefers-color-scheme: dark) {
            html, body { background: #121212; color: #fff; }
        }
        #unsupported {
            display: none; box-sizing: border-box; height: 100%; padding: 32px;
            font: 17px -apple-system, system-ui, sans-serif; text-align: center;
            flex-direction: column; justify-content: center;
        }
        /* Over the app's canvas, which stops drawing when the app crashes. */
        #crashed {
            display: none; position: fixed; inset: 0; z-index: 2147483647; box-sizing: border-box; padding: 32px;
            background: inherit; font: 17px -apple-system, system-ui, sans-serif; text-align: center;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #crashed button { font: inherit; padding: 10px 24px; border: 0; border-radius: 6px; background: #6200EE; color: #fff; }
        #crashed pre {
            max-width: 100%; max-height: 30vh; overflow: auto; text-align: left; white-space: pre-wrap;
            font-size: 12px; opacity: 0.7;
        }
    </style>
    <script>
        // Shows #crashed when the app has stopped for good, instead of leaving a white page, with what the browser said:
        // reloading usually helps, and the text is something to send whoever runs the server. Two signs mean that:
        // kotlinx.coroutines saying a coroutine's error handler itself failed, which is how Compose stopping looks,
        // and a WebAssembly trap. The app's own errors are handled inside it (AppViewModel.launchSafely).
        (function () {
            var details = null;
            // Also when the crash came before the page's body existed; DOMContentLoaded shows it then.
            // Built when needed: the app empties <body> when it starts.
            function render() {
                if (details === null || document.body === null || document.getElementById("crashed") !== null) return;
                var box = document.createElement("div");
                box.id = "crashed";
                box.innerHTML = "<p><strong>DrinkWater stopped working.</strong></p>" +
                    "<p>Reloading usually helps. If it keeps happening, send whoever runs the server what it says below.</p>" +
                    "<p><button type=\"button\">Reload</button></p><pre></pre>";
                box.querySelector("button").onclick = function () { location.reload(); };
                box.querySelector("pre").textContent = details;
                document.body.appendChild(box);
                box.style.display = "flex";
            }
            function show(text) {
                if (details !== null) return;
                details = String(text);
                render();
            }
            document.addEventListener("DOMContentLoaded", render);
            var error = console.error;
            console.error = function () {
                error.apply(console, arguments);
                var text = Array.prototype.map.call(arguments, String).join(" ");
                if (text.indexOf("Exception while trying to handle coroutine exception") !== -1) show(text);
            };
            window.addEventListener("error", function (event) {
                if (typeof WebAssembly === "object" && event.error instanceof WebAssembly.RuntimeError) {
                    show(event.error.stack || event.error);
                }
            });
        })();
    </script>
    <script>
        // The app needs WebAssembly garbage collection: iOS/Safari 18.2, Chrome 119 or Firefox 120 and later.
        // This validates the smallest module that declares a GC struct type.
        var wasmGc = typeof WebAssembly === "object" && WebAssembly.validate(new Uint8Array(
            [0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 127, 0]));
        if (wasmGc) {
            document.write('<script src="composeApp.js"><\/script>');
            // Receives push notifications; see sw.js.
            if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
        } else {
            document.addEventListener("DOMContentLoaded", function () {
                document.getElementById("unsupported").style.display = "flex";
            });
        }
    </script>
</head>
<body>
<div id="unsupported">
    <p><strong>DrinkWater needs a newer browser.</strong></p>
    <p>On iPhone, update to iOS 18.2 or later under Settings → General → Software Update.</p>
</div>
</body>
</html>
